<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101320">
  <title>스와이프 벽돌깨기</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="constants.js"></script>
  <script defer src="index.js"></script>
</head>
<body>
  <main class="layout">
    <section class="game-shell" aria-label="스와이프 벽돌깨기">
      <header class="game-header">
        <div class="scoreboard">
          <div>
            <span>SCORE</span>
            <strong id="score">1</strong>
          </div>
          <div class="best">
            <span>BEST</span>
            <strong id="best">0</strong>
          </div>
        </div>
        <button id="restart" class="icon-button" aria-label="게임 다시 시작" title="다시 시작">↻</button>
      </header>
      <div class="board-wrap">
        <canvas id="game" width="502" height="560" tabindex="0" aria-label="위쪽으로 드래그 후 놓아서 공을 발사하세요. 키보드 좌우 방향키로 조준하고 Enter로 발사할 수 있습니다."></canvas>
        <div id="overlay" class="overlay" hidden>
          <div class="end-card">
            <h2>게임 종료</h2>
            <p id="result"></p>
            <button id="play-again">다시 플레이</button>
          </div>
        </div>
      </div>
      <footer class="game-footer">
        <button id="recall" disabled>빠른 회수 ↓</button>
      </footer>
    </section>
  </main>
</body>
</html>
